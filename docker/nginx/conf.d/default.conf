# Nginx Reverse Proxy Configuration for CodePrism Single-Origin Deployment
# Resolves internal container hostnames on Docker bridge network

upstream frontend-upstream {
    server frontend:3000;
    keepalive 32;
}

upstream backend-app-upstream {
    server backend:8081;
    keepalive 32;
}

upstream backend-mgmt-upstream {
    server backend:8082;
    keepalive 8;
}

server {
    listen 80;
    server_name localhost;

    # Maximum client request body size (e.g. for uploads or repo operations)
    client_max_body_size 50M;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Forwarded as https so Spring Boot Framework-level forward header strategy
    # generates OAuth redirect URIs using https scheme
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;

    # ── 1. Actuator Health (Publicly Accessible) ─────────────────────────────
    # Only GET /actuator/health is routed to internal management port 8082
    location = /actuator/health {
        limit_except GET {
            deny all;
        }
        proxy_pass http://backend-mgmt-upstream/actuator/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ── 2. Block all other Actuator endpoints ────────────────────────────────
    # Prevents /actuator/prometheus, /actuator/env, etc. from external access
    location /actuator/ {
        return 404;
    }

    # ── 3. Streaming Chat Route (SSE) ────────────────────────────────────────
    # Crucial: Disable proxy buffering and set 300s timeout so SSE streams chunk-by-chunk
    location ~ ^/api/chat/sessions/[^/]+/messages {
        proxy_pass http://backend-app-upstream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        # Explicitly repeat proxy headers because defining proxy_set_header in a child block
        # disables inheritance of parent proxy_set_header directives in Nginx
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection '';
    }

    # ── 4. Backend REST APIs ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend-app-upstream;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ── 5. GitHub OAuth Flow ─────────────────────────────────────────────────
    location /oauth2/ {
        proxy_pass http://backend-app-upstream;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /login/oauth2/ {
        proxy_pass http://backend-app-upstream;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ── 6. Next.js Frontend (Default Route) ──────────────────────────────────
    location / {
        proxy_pass http://frontend-upstream;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
