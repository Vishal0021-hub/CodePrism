services:
  # ── PostgreSQL with pgvector extension ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codeprism-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeprism
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - codeprism_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeprism"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend (Spring Boot 4.x / Java 21) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeprism-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/codeprism
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      FRONTEND_URL: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost
      GEMINI_API_KEY: ${GEMINI_API_KEY:-REPLACE_ME}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-REPLACE_ME}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-REPLACE_ME}
      TOKEN_ENCRYPTOR_PASSWORD: ${TOKEN_ENCRYPTOR_PASSWORD:-local-token-encrypt-key-change-me-32}
      TOKEN_ENCRYPTOR_SALT: ${TOKEN_ENCRYPTOR_SALT:-deadbeefcafebabe}
      APP_SECURITY_ALLOW_TEST_LOGIN: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend (Next.js 16 Standalone) ────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: codeprism-frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: http://backend:8081
      NEXT_PUBLIC_API_BASE_URL: ""
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx Reverse Proxy (Single-Origin Gateway) ─────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: codeprism-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  codeprism_pgdata:
    name: codeprism_pgdata
