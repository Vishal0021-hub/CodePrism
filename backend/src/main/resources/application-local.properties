# Local development profile — active when spring.profiles.active=local
# These are safe dev-only defaults. Never used in production.

# ── Database ──────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/codeprism}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ── Schema management ─────────────────────────────────────────────────────
# update is acceptable for local dev; prod uses Flyway (validate).
spring.jpa.hibernate.ddl-auto=update
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.flyway.enabled=false

# ── Secrets (dev-only placeholder values) ─────────────────────────────────
spring.ai.openai.api-key=${GEMINI_API_KEY:}
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}

# ── App URLs ──────────────────────────────────────────────────────────────
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Token Encryption (dev defaults; never use these values in prod) ────────
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:codeprism-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}

# ── Actuator ──────────────────────────────────────────────────────────────
# Expose everything locally for debugging convenience.
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
