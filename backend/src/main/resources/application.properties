spring.application.name=backend

# ---------------------------------------------------------------------------
# Active profile: override via SPRING_PROFILES_ACTIVE env var.
# Defaults to 'local' so IDE / test runs work without explicit configuration.
# Production MUST set SPRING_PROFILES_ACTIVE=prod in the container environment.
# ---------------------------------------------------------------------------
spring.profiles.default=local


# ── Database (overridden per profile) ─────────────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── Web ───────────────────────────────────────────────────────────────────
server.port=8081

# ── Session Cookie ────────────────────────────────────────────────────────
server.servlet.session.cookie.name=CODEPRISM_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# ── Gemini AI (endpoint is stable across environments) ───────────────────
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.model=gemini-3.6-flash
spring.ai.openai.embedding.model=gemini-embedding-001

# ── PgVector ─────────────────────────────────────────────────────────────
spring.ai.vectorstore.pgvector.dimensions=3072
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# ── Indexing tunables ─────────────────────────────────────────────────────
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.indexing.max-tree-entries=5000
app.github.api-delay-ms=50
app.github.connect-timeout-ms=10000
app.gemini.read-timeout-ms=120000

# ── RAG ───────────────────────────────────────────────────────────────────
rag.similarity-threshold=0.5

# ── Flyway (disabled by default; enabled in prod) ─────────────────────────
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# ── Graceful Shutdown ─────────────────────────────────────────────────────
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── App URLs & CORS Defaults ──────────────────────────────────────────────
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Token Encryption (dev defaults; overridden in prod) ───────────────────
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:codeprism-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}

# ── GitHub OAuth2 ─────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.provider.github.user-name-attribute=id