# Production profile — active when SPRING_PROFILES_ACTIVE=prod
# All values must come from environment variables. No hardcoded URLs or secrets.
# REPLACE_ME values must be set before starting the container.

# ── Database ──────────────────────────────────────────────────────────────
# Example: jdbc:postgresql://postgres:5432/codeprism  (Docker Compose service name)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── Schema management — Flyway handles all DDL in prod ────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Secrets ───────────────────────────────────────────────────────────────
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

# ── App URLs ──────────────────────────────────────────────────────────────
# FRONTEND_URL = https://<cloudfront-id>.cloudfront.net
app.frontend-url=${FRONTEND_URL}
# Comma-separated allowed CORS origins (same value as FRONTEND_URL for single-origin)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ── Token Encryption ──────────────────────────────────────────────────────
# Generate with: openssl rand -hex 32
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD}
# Must be a 16-char hex string. Generate with: openssl rand -hex 8
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT}

# ── Proxy / Forward-headers ───────────────────────────────────────────────
# Makes Spring use X-Forwarded-Proto so OAuth redirect URIs use https:// not http://
server.forward-headers-strategy=framework

# ── Actuator ─────────────────────────────────────────────────────────────
# /actuator/health is publicly reachable through Nginx (for container health checks).
# /actuator/prometheus is served on management.server.port=8082 (internal network only).
# Nginx MUST NOT forward port 8082 to the public.
management.server.port=8082
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

# ── Graceful shutdown ─────────────────────────────────────────────────────
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── Logging ───────────────────────────────────────────────────────────────
logging.level.codeprism=INFO
logging.level.org.springframework.security=WARN
logging.structured.format.console=logstash

